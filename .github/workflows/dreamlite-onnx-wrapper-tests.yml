name: DreamLite ONNX wrapper tests

on:
  push:
    branches:
      - feature/dreamlite-android-integration
    paths:
      - "tools/dreamlite_onnx/**"
      - ".github/workflows/dreamlite-onnx-wrapper-tests.yml"
  pull_request:
    paths:
      - "tools/dreamlite_onnx/**"
      - ".github/workflows/dreamlite-onnx-wrapper-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile exporter
        run: python -m py_compile tools/dreamlite_onnx/export_mobile.py tools/dreamlite_onnx/test_export_mobile.py
      - name: Run wrapper contract tests
        run: python -m unittest discover -s tools/dreamlite_onnx -p "test_*.py" -v
